<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객지원 | K-FOOD ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f9f9f9; }
        .support-wrapper { max-width: 1000px; margin: 120px auto 100px; padding: 0 20px; }
        
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .board-title { font-size: 2rem; font-weight: 800; }
        .btn-write { background: var(--ksh-blue, #2189ff); color: #fff; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-write:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(33, 137, 255, 0.3); }

        .post-list { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .post-item { display: grid; grid-template-columns: 1fr auto auto; padding: 20px 30px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; align-items: center; }
        .post-item:last-child { border-bottom: none; }
        .post-item:hover { background: #fcfcfc; }
        .post-main-info { display: flex; flex-direction: column; gap: 5px; }
        .post-title { font-weight: 700; font-size: 1.1rem; color: #333; display: flex; align-items: center; gap: 10px; }
        .post-author { font-size: 0.9rem; color: #888; }
        .post-date { font-size: 0.85rem; color: #aaa; text-align: right; min-width: 100px; }
        .private-icon { color: #f39c12; font-size: 0.9rem; }

        .form-container { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: none; }
        .form-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .btn-back-list { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #666; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 15px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; margin-bottom: 20px; font-weight: 600; }
        .pw-group { display: none; margin-top: 10px; }

        .submit-btn { background: #000; color: #fff; border: none; padding: 15px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .submit-btn:disabled { background: #888; cursor: not-allowed; }

        .post-detail-view { display: none; background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 20px; }
        .p-content { white-space: pre-wrap; line-height: 1.6; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="gnb">
            <div class="container gnb-inner">
                <div class="logo"><a href="index.html">K-FOOD <span>ARCHIVE</span></a></div>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="index.html">홈으로 가기</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="support-wrapper">
        <div id="board-list-view">
            <div class="board-header">
                <h1 class="board-title">고객지원 게시판</h1>
                <button class="btn-write" id="show-write-form"><i class="fas fa-pen"></i> 글쓰기</button>
            </div>
            <div class="post-list" id="post-list-container">
                <div style="padding:100px 0; text-align:center; color:#888;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i><br>
                    파이어베이스 연결 확인 중...
                </div>
            </div>
        </div>

        <div id="board-write-view" class="form-container">
            <div class="form-header">
                <button class="btn-back-list" id="back-to-list"><i class="fas fa-arrow-left"></i> 목록으로</button>
                <h2 style="margin:0">게시글 작성</h2>
            </div>
            <form id="support-form">
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" id="post-title" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>작성자</label>
                    <input type="text" id="post-author" placeholder="이름을 입력하세요" required>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="post-is-private"> 🔒 비밀글로 설정하기
                </label>
                <div class="form-group pw-group" id="pw-group">
                    <label>비밀번호 (4자리 영문/숫자)</label>
                    <input type="password" id="post-password" placeholder="비밀번호 설정" maxlength="4">
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <textarea id="post-content" style="min-height:200px" placeholder="문의 내용을 상세히 적어주세요" required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">작성 완료</button>
            </form>
        </div>

        <div id="board-detail-view" class="post-detail-view">
            <button class="btn-back-list" id="back-to-list-from-detail" style="margin-bottom:20px; padding:0"><i class="fas fa-arrow-left"></i> 목록으로 돌아가기</button>
            <h2 id="view-title"></h2>
            <div style="color:#888; font-size:0.9rem; margin-top:10px;">
                작성자: <span id="view-author"></span> | <span id="view-date"></span>
            </div>
            <div class="p-content" id="view-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // 파이어베이스 설정 (본인의 정보를 반드시 입력하세요!)
        const firebaseConfig = {
          apiKey: "AIzaSyD_ocC6LdqJ1HxK-5dga3HJ1r3Eap0lXHk",
          authDomain: "kshfood-f4e24.firebaseapp.com",
          projectId: "kshfood-f4e24",
          storageBucket: "kshfood-f4e24.firebasestorage.app",
          messagingSenderId: "433157257385",
          appId: "1:433157257385:web:c5c6c713bf40f4c35091b8",
          measurementId: "G-JZSFXKKETL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const listView = document.getElementById('board-list-view');
        const writeView = document.getElementById('board-write-view');
        const detailView = document.getElementById('board-detail-view');
        const listContainer = document.getElementById('post-list-container');
        const supportForm = document.getElementById('support-form');
        const isPrivateCheckbox = document.getElementById('post-is-private');
        const pwGroup = document.getElementById('pw-group');

        const switchView = (v) => {
            listView.style.display = v === 'list' ? 'block' : 'none';
            writeView.style.display = v === 'write' ? 'block' : 'none';
            detailView.style.display = v === 'detail' ? 'block' : 'none';
            window.scrollTo(0,0);
        };

        document.getElementById('show-write-form').onclick = () => switchView('write');
        document.getElementById('back-to-list').onclick = () => switchView('list');
        document.getElementById('back-to-list-from-detail').onclick = () => switchView('list');
        isPrivateCheckbox.onchange = (e) => pwGroup.style.display = e.target.checked ? 'block' : 'none';

        // 목록 로드
        const q = query(collection(db, "support_posts"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                listContainer.innerHTML = '<div style="padding:100px 0; text-align:center; color:#888;">첫 게시글을 작성해 보세요!</div>';
                return;
            }
            listContainer.innerHTML = snapshot.docs.map(doc => {
                const d = doc.data();
                const date = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleDateString() : '방금 전';
                return `
                    <div class="post-item" data-id="${doc.id}">
                        <div class="post-main-info">
                            <div class="post-title">${d.isPrivate ? '<i class="fas fa-lock private-icon"></i> 비밀글입니다.' : d.title}</div>
                            <div class="post-author">${d.author}</div>
                        </div>
                        <div class="post-date">${date}</div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.post-item').forEach(item => {
                item.onclick = () => {
                    const id = item.dataset.id;
                    const docData = snapshot.docs.find(d => d.id === id).data();
                    if (docData.isPrivate) {
                        const pw = prompt("비밀번호 4자리를 입력하세요:");
                        if (pw !== docData.password) return alert("비밀번호가 일치하지 않습니다.");
                    }
                    document.getElementById('view-title').innerText = docData.title;
                    document.getElementById('view-author').innerText = docData.author;
                    document.getElementById('view-date').innerText = docData.timestamp ? new Date(docData.timestamp.seconds * 1000).toLocaleString() : '';
                    document.getElementById('view-content').innerText = docData.content;
                    switchView('detail');
                };
            });
        }, (err) => {
            listContainer.innerHTML = `<div style="padding:50px; text-align:center; color:red;">에러 발생: ${err.message}<br>파이어베이스 설정을 확인하세요.</div>`;
        });

        // 글쓰기 기능 (에러 핸들링 강화)
        supportForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');

            if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                alert("파이어베이스 API Key가 설정되지 않았습니다. support.html 파일 내 설정을 본인의 것으로 변경해 주세요.");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "서버 전송 중...";
                
                await addDoc(collection(db, "support_posts"), {
                    title: document.getElementById('post-title').value,
                    author: document.getElementById('post-author').value,
                    content: document.getElementById('post-content').value,
                    isPrivate: isPrivateCheckbox.checked,
                    password: isPrivateCheckbox.checked ? document.getElementById('post-password').value : "",
                    timestamp: serverTimestamp()
                });

                alert("게시글이 성공적으로 등록되었습니다.");
                supportForm.reset();
                pwGroup.style.display = 'none';
                switchView('list');
            } catch (err) {
                console.error(err);
                alert("전송 실패: " + err.message + "\n\n도메인 승인(Authorized Domains) 및 Firestore 규칙을 확인해 주세요.");
            } finally {
                btn.disabled = false;
                btn.innerText = "작성 완료";
            }
        };
    </script>
</body>
</html>
