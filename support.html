<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고객지원 | K-FOOD ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f9f9f9; }
        .support-wrapper { max-width: 1000px; margin: 120px auto 100px; padding: 0 20px; }
        
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .board-title { font-size: 2rem; font-weight: 800; }
        .btn-write { background: var(--ksh-blue, #2189ff); color: #fff; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-write:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(33, 137, 255, 0.3); }

        .post-list { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .post-item { display: grid; grid-template-columns: 1fr auto auto; padding: 20px 30px; border-bottom: 1px solid #eee; cursor: pointer; transition: 0.2s; align-items: center; }
        .post-item:last-child { border-bottom: none; }
        .post-item:hover { background: #fcfcfc; }
        .post-main-info { display: flex; flex-direction: column; gap: 5px; }
        .post-title { font-weight: 700; font-size: 1.1rem; color: #333; display: flex; align-items: center; gap: 10px; }
        .post-author { font-size: 0.9rem; color: #888; }
        .post-date { font-size: 0.85rem; color: #aaa; text-align: right; min-width: 100px; }
        .private-icon { color: #f39c12; font-size: 0.9rem; }

        .form-container { background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: none; }
        .form-header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .btn-back-list { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #666; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 15px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; margin-bottom: 20px; font-weight: 600; }
        .pw-group { display: none; margin-top: 10px; }

        .submit-btn { background: #000; color: #fff; border: none; padding: 15px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .submit-btn:disabled { background: #888; cursor: not-allowed; }

        .post-detail-view { display: none; background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 20px; }
        .p-content { white-space: pre-wrap; line-height: 1.6; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="gnb">
            <div class="container gnb-inner">
                <div class="logo"><a href="index.html">K-FOOD <span>ARCHIVE</span></a></div>
                <div class="lang-switcher">
                    <select id="lang-select" class="lang-select">
                        <option value="ko">KR</option>
                        <option value="en">EN</option>
                        <option value="ja">JP</option>
                    </select>
                </div>
                <nav class="nav-menu">
                    <ul>
                        <li><a href="index.html" id="nav-home">홈으로 가기</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="support-wrapper">
        <div id="board-list-view">
            <div class="board-header">
                <h1 class="board-title" id="board-title">고객지원 게시판</h1>
                <button class="btn-write" id="show-write-form"><i class="fas fa-pen"></i> <span id="write-btn-label">글쓰기</span></button>
            </div>
            <p id="board-desc" style="margin-top:-20px; margin-bottom:30px; color:#666; font-weight:500;">
                아카이브에 추가하고 싶은 음식이 있거나 서비스에 대해 궁금한 점이 있으시면 자유롭게 글을 남겨주세요.
            </p>
            <div class="post-list" id="post-list-container">
                <div style="padding:100px 0; text-align:center; color:#888;">
                    <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; margin-bottom: 15px;"></i><br>
                    파이어베이스 연결 확인 중...
                </div>
            </div>
        </div>

        <div id="board-write-view" class="form-container">
            <div class="form-header">
                <button class="btn-back-list" id="back-to-list"><i class="fas fa-arrow-left"></i> <span id="back-list-label">목록으로</span></button>
                <h2 id="write-title" style="margin:0">게시글 작성</h2>
            </div>
            <form id="support-form">
                <div class="form-group">
                    <label id="label-title">제목</label>
                    <input type="text" id="post-title" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label id="label-author">작성자</label>
                    <input type="text" id="post-author" placeholder="이름을 입력하세요" required>
                </div>
                <label class="checkbox-group" id="label-private">
                    <input type="checkbox" id="post-is-private"> <span id="private-text">🔒 비밀글로 설정하기</span>
                </label>
                <div class="form-group pw-group" id="pw-group">
                    <label id="label-pw">비밀번호 (4자리 영문/숫자)</label>
                    <input type="password" id="post-password" placeholder="비밀번호 설정" maxlength="4">
                </div>
                <div class="form-group">
                    <label id="label-content">내용</label>
                    <textarea id="post-content" style="min-height:200px" placeholder="문의 내용을 상세히 적어주세요" required></textarea>
                </div>
                <button type="submit" class="submit-btn" id="submit-btn">작성 완료</button>
            </form>
        </div>

        <div id="board-detail-view" class="post-detail-view">
            <button class="btn-back-list" id="back-to-list-from-detail" style="margin-bottom:20px; padding:0"><i class="fas fa-arrow-left"></i> <span id="back-list-return">목록으로 돌아가기</span></button>
            <h2 id="view-title"></h2>
            <div style="color:#888; font-size:0.9rem; margin-top:10px;">
                <span id="label-view-author">작성자:</span> <span id="view-author"></span> | <span id="view-date"></span>
            </div>
            <div class="p-content" id="view-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const i18n = {
            ko: {
                navHome: '홈으로 가기', supportTitle: '고객지원 게시판', supportDesc: '아카이브에 추가하고 싶은 음식이 있거나 서비스에 대해 궁금한 점이 있으시면 자유롭게 글을 남겨주세요.',
                writeBtn: '글쓰기', backToList: '목록으로', writeTitle: '게시글 작성', labelTitle: '제목', labelAuthor: '작성자',
                privateText: '🔒 비밀글로 설정하기', labelPw: '비밀번호 (4자리 영문/숫자)', labelContent: '내용', submitBtn: '작성 완료',
                phTitle: '제목을 입력하세요', phAuthor: '이름을 입력하세요', phPw: '비밀번호 설정', phContent: '문의 내용을 상세히 적어주세요',
                backReturn: '목록으로 돌아가기', labelViewAuthor: '작성자:', loading: '파이어베이스 연결 확인 중...', empty: '첫 게시글을 작성해 보세요!',
                alertSuccess: '게시글이 성공적으로 등록되었습니다.', alertNoPw: '비밀번호가 일치하지 않습니다.', promptPw: '비밀번호 4자리를 입력하세요:',
                lockText: '비밀글입니다.'
            },
            en: {
                navHome: 'Go Home', supportTitle: 'Customer Support', supportDesc: 'If you have any food you want to add to the archive or questions, please leave a message.',
                writeBtn: 'Write', backToList: 'List', writeTitle: 'Create Post', labelTitle: 'Title', labelAuthor: 'Author',
                privateText: '🔒 Set as private', labelPw: 'Password (4 digits)', labelContent: 'Content', submitBtn: 'Submit',
                phTitle: 'Enter title', phAuthor: 'Enter name', phPw: 'Set password', phContent: 'Enter details here',
                backReturn: 'Back to List', labelViewAuthor: 'Author:', loading: 'Checking connection...', empty: 'Be the first to post!',
                alertSuccess: 'Post registered successfully.', alertNoPw: 'Password does not match.', promptPw: 'Enter 4 digit password:',
                lockText: 'Private post.'
            },
            ja: {
                navHome: 'トップへ戻る', supportTitle: 'カスタマーサポート', supportDesc: 'アーカイブに追加したい料理やサービスに関するお問い合わせは、こちらに自由にご記入ください。',
                writeBtn: '新規作成', backToList: '戻る', writeTitle: '投稿を作成', labelTitle: 'タイトル', labelAuthor: '作成者',
                privateText: '🔒 非公開に設定', labelPw: 'パスワード（4桁）', labelContent: '内容', submitBtn: '投稿する',
                phTitle: 'タイトルを入力', phAuthor: '名前を入力', phPw: 'パスワード設定', phContent: 'お問い合わせ内容を入力してください',
                backReturn: '一覧へ戻る', labelViewAuthor: '作成者:', loading: '接続を確認中...', empty: '最初の投稿をしてみましょう！',
                alertSuccess: '投稿が完了しました。', alertNoPw: 'パスワードが一致しません。', promptPw: '4桁のパスワードを入力してください：',
                lockText: '非公開の投稿です。'
            }
        };

        let currentLang = localStorage.getItem('kfood_lang') || 'ko';

        const updateUI = () => {
            const t = i18n[currentLang];
            document.getElementById('nav-home').innerText = t.navHome;
            document.getElementById('board-title').innerText = t.supportTitle;
            document.getElementById('board-desc').innerText = t.supportDesc;
            document.getElementById('write-btn-label').innerText = t.writeBtn;
            document.getElementById('back-list-label').innerText = t.backToList;
            document.getElementById('write-title').innerText = t.writeTitle;
            document.getElementById('label-title').innerText = t.labelTitle;
            document.getElementById('label-author').innerText = t.labelAuthor;
            document.getElementById('private-text').innerText = t.privateText;
            document.getElementById('label-pw').innerText = t.labelPw;
            document.getElementById('label-content').innerText = t.labelContent;
            document.getElementById('submit-btn').innerText = t.submitBtn;
            document.getElementById('back-list-return').innerText = t.backReturn;
            document.getElementById('label-view-author').innerText = t.labelViewAuthor;

            document.getElementById('post-title').placeholder = t.phTitle;
            document.getElementById('post-author').placeholder = t.phAuthor;
            document.getElementById('post-password').placeholder = t.phPw;
            document.getElementById('post-content').placeholder = t.phContent;

            // Update language dots
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
        };

        const langSelect = document.getElementById('lang-select');
        if (langSelect) {
            langSelect.value = currentLang;
            langSelect.onchange = (e) => {
                currentLang = e.target.value;
                localStorage.setItem('kfood_lang', currentLang);
                updateUI();
                location.reload();
            };
        }

        updateUI();

        // 파이어베이스 설정 (본인의 정보를 반드시 입력하세요!)
        const firebaseConfig = {
          apiKey: "AIzaSyD_ocC6LdqJ1HxK-5dga3HJ1r3Eap0lXHk",
          authDomain: "kshfood-f4e24.firebaseapp.com",
          projectId: "kshfood-f4e24",
          storageBucket: "kshfood-f4e24.firebasestorage.app",
          messagingSenderId: "433157257385",
          appId: "1:433157257385:web:c5c6c713bf40f4c35091b8",
          measurementId: "G-JZSFXKKETL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const listView = document.getElementById('board-list-view');
        const writeView = document.getElementById('board-write-view');
        const detailView = document.getElementById('board-detail-view');
        const listContainer = document.getElementById('post-list-container');
        const supportForm = document.getElementById('support-form');
        const isPrivateCheckbox = document.getElementById('post-is-private');
        const pwGroup = document.getElementById('pw-group');

        const switchView = (v) => {
            listView.style.display = v === 'list' ? 'block' : 'none';
            writeView.style.display = v === 'write' ? 'block' : 'none';
            detailView.style.display = v === 'detail' ? 'block' : 'none';
            window.scrollTo(0,0);
        };

        document.getElementById('show-write-form').onclick = () => switchView('write');
        document.getElementById('back-to-list').onclick = () => switchView('list');
        document.getElementById('back-to-list-from-detail').onclick = () => switchView('list');
        isPrivateCheckbox.onchange = (e) => pwGroup.style.display = e.target.checked ? 'block' : 'none';

        // 목록 로드
        const q = query(collection(db, "support_posts"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const t = i18n[currentLang];
            if (snapshot.empty) {
                listContainer.innerHTML = `<div style="padding:100px 0; text-align:center; color:#888;">${t.empty}</div>`;
                return;
            }
            listContainer.innerHTML = snapshot.docs.map(doc => {
                const d = doc.data();
                const date = d.timestamp ? new Date(d.timestamp.seconds * 1000).toLocaleDateString() : '...';
                return `
                    <div class="post-item" data-id="${doc.id}">
                        <div class="post-main-info">
                            <div class="post-title">${d.isPrivate ? `<i class="fas fa-lock private-icon"></i> ${t.lockText}` : d.title}</div>
                            <div class="post-author">${d.author}</div>
                        </div>
                        <div class="post-date">${date}</div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.post-item').forEach(item => {
                item.onclick = () => {
                    const t = i18n[currentLang];
                    const id = item.dataset.id;
                    const docData = snapshot.docs.find(d => d.id === id).data();
                    if (docData.isPrivate) {
                        const pw = prompt(t.promptPw);
                        if (pw !== docData.password) return alert(t.alertNoPw);
                    }
                    document.getElementById('view-title').innerText = docData.title;
                    document.getElementById('view-author').innerText = docData.author;
                    document.getElementById('view-date').innerText = docData.timestamp ? new Date(docData.timestamp.seconds * 1000).toLocaleString() : '';
                    document.getElementById('view-content').innerText = docData.content;
                    switchView('detail');
                };
            });
        }, (err) => {
            listContainer.innerHTML = `<div style="padding:50px; text-align:center; color:red;">Error: ${err.message}</div>`;
        });

        // 글쓰기 기능 (에러 핸들링 강화)
        supportForm.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const t = i18n[currentLang];

            try {
                btn.disabled = true;
                btn.innerText = "...";
                
                await addDoc(collection(db, "support_posts"), {
                    title: document.getElementById('post-title').value,
                    author: document.getElementById('post-author').value,
                    content: document.getElementById('post-content').value,
                    isPrivate: isPrivateCheckbox.checked,
                    password: isPrivateCheckbox.checked ? document.getElementById('post-password').value : "",
                    timestamp: serverTimestamp()
                });

                alert(t.alertSuccess);
                supportForm.reset();
                pwGroup.style.display = 'none';
                switchView('list');
            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = t.submitBtn;
            }
        };
    </script>
</body>
</html>
